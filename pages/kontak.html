<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontak - Tembakau Serbarasa</title>
    <link rel="stylesheet" href="../style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="../img/icon/bako.png" />

    <style>
      body {
        font-family: "Poppins", sans-serif;
        background-color: #1f1f1f;
        color: #f5f5f5;
        margin: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      header {
        background-color: rgba(17, 17, 17, 0.8);
        backdrop-filter: blur(6px);
        padding: 15px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .logo a {
        color: #d4a373;
        font-weight: bold;
        font-size: 1.5rem;
        text-decoration: none;
      }

      main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 50px 20px;
      }

      .contact-card {
        background: #2a2a2a;
        padding: 40px;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        max-width: 400px;
        width: 100%;
        animation: fadeIn 0.5s ease-in-out;
      }

      .contact-card h1 {
        color: #d4a373;
        margin-bottom: 15px;
      }

      .contact-card p {
        font-size: 1rem;
        color: #ccc;
        margin-bottom: 30px;
      }

      .contact-info {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .contact-info a {
        text-decoration: none;
        color: #f5f5f5;
        background: #3b3b3b;
        padding: 12px 18px;
        border-radius: 8px;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-weight: 500;
      }

      .contact-info a:hover {
        background-color: #d4a373;
        color: #1f1f1f;
        transform: translateY(-2px);
      }

      .contact-info i {
        font-size: 1.2rem;
      }

      footer {
        background-color: #111;
        text-align: center;
        padding: 15px;
        color: #888;
        font-size: 0.9rem;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 600px) {
        .contact-card {
          padding: 30px 20px;
        }

        .contact-info a {
          font-size: 0.95rem;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="logo">
        <a href="../index.html">Tembakau Serbarasa</a>
      </div>
      <nav>
        <ul>
          <li><a href="../index.html">Beranda</a></li>
          <li><a href="produk.html">Produk</a></li>
          <li><a href="tentang.html">Tentang</a></li>
          <li><a href="kontak.html" class="active">Kontak</a></li>
        </ul>
        <div class="menu-toggle">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </nav>
    </header>

    <main>
      <div class="contact-card">
        <h1>Hubungi Kami</h1>
        <p>Jika punya pertanyaan dan berikan kritik dan saran.</p>

        <div class="contact-info">
          <a href="https://wa.me/6282299999202" target="_blank">
            <i class="fa-brands fa-whatsapp"></i> WhatsApp
          </a>

          <a href="https://www.instagram.com/tembakauserbarasa" target="_blank">
            <i class="fa-brands fa-instagram"></i> Instagram
          </a>

          <a href="tel:+6282299999202">
            <i class="fa-solid fa-phone"></i> +62 822 9999 9202
          </a>
        </div>
      </div>
    </main>

    <footer>
      <p>© 2025 Tembakau Serbarasa. Semua hak dilindungi.</p>
    </footer>
  </body>
</html>
